<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#f4eee2" />
  <title>Statics Calculator</title>
  <style>
.srOnly{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}

.calculatorToggle{height:52px;min-width:94px;padding:7px 10px;border:1px solid #c3baaa;background:#efe9dd;color:#29322f;cursor:pointer;text-align:left;transition:background .12s ease,border-color .12s ease,transform .08s ease}
.calculatorToggle:hover{border-color:#668f89;background:#f7f2e8}
.calculatorToggle:active{transform:translateY(1px)}
.calculatorToggleTop{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:7px;letter-spacing:.13em;color:#7c776d;margin-bottom:4px}
.calculatorToggleMain{display:flex;align-items:center;justify-content:space-between;gap:9px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.calculatorToggleMain b{font-size:18px;color:#2f7774;line-height:1}
.calculatorToggleMain span{font-size:7px;letter-spacing:.08em;color:#77766f}

.calculatorMobileToggle{display:none;position:fixed;right:14px;bottom:14px;z-index:88;width:48px;height:48px;border-radius:50%;border:1px solid #557f79;background:#2f7774;color:#fffaf0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:900;font-size:18px;box-shadow:0 10px 26px rgba(40,62,57,.2);cursor:pointer}
.calculatorMobileToggle:active{transform:scale(.96)}

.scientificCalc{position:fixed;right:18px;top:98px;z-index:87;width:min(410px,calc(100vw - 28px));max-height:calc(100vh - 116px);overflow:auto;border:1px solid #aca293;background:#f4eee2;color:#28312e;box-shadow:0 28px 70px rgba(61,51,37,.26),0 0 0 1px rgba(255,255,255,.5) inset;opacity:0;visibility:hidden;transform:translateY(-8px) scale(.985);transform-origin:top right;transition:opacity .12s ease,transform .12s ease,visibility 0s linear .12s}
.scientificCalc.open{opacity:1;visibility:visible;transform:none;transition:opacity .12s ease,transform .12s ease}
.calcTopbar{min-height:58px;padding:10px 10px 10px 13px;border-bottom:1px solid #c7beaf;background:#e8e1d4;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:2}
.calcIdentity{display:flex;align-items:center;gap:10px;min-width:0}
.calcCode{width:36px;height:36px;display:grid;place-items:center;border:1px solid #879b91;color:#2f7774;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:8px;font-weight:900;flex:0 0 auto}
.calcIdentity>div{min-width:0;display:flex;flex-direction:column}
.calcIdentity strong{font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.calcIdentity small{margin-top:3px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:7px;letter-spacing:.055em;color:#77766f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calcTopActions{display:flex;gap:5px}
.calcAngleSwitch{height:34px;display:grid;grid-template-columns:1fr 1fr;border:1px solid #b8afa0;background:#ddd5c8;overflow:hidden}
.calcAngleOption{min-width:46px;height:32px;border:0;border-right:1px solid #b8afa0;background:#eee8dd;color:#78786f;cursor:pointer;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:8px;font-weight:900;letter-spacing:.06em;transition:background .08s ease,color .08s ease,box-shadow .08s ease}
.calcAngleOption:last-child{border-right:0}
.calcAngleOption:hover{background:#f8f3e9;color:#3f5550}
.calcAngleOption.active{background:#2f7774;color:#fffaf0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.calcCloseBtn{width:34px;height:34px;border:1px solid #b8afa0;background:#f8f3e9;color:#49544f;cursor:pointer;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:18px;font-weight:400}
.calcCloseBtn:hover{background:#fffaf0;border-color:#7d948c}

.calcDisplay{padding:14px;background:#17212a;color:#edf3ef;border-bottom:1px solid #b8afa0}
.calcDisplayMeta{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:7px;letter-spacing:.1em;color:#8ea29d}
.calcExpression{display:block;width:100%;height:44px;padding:8px 10px;border:1px solid #3d4e54;background:#10191f;color:#eef5f1;outline:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;line-height:1.2;caret-color:#63c0b5}
.calcExpression:focus{border-color:#64a69d;box-shadow:0 0 0 2px rgba(99,192,181,.12)}
.calcExpression::selection{background:#2f7774;color:#fff}
.calcResultRow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:7px;margin-top:9px;min-width:0}
.calcResultRow>span{color:#6fc6bb;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.calcResult{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:25px;font-weight:800;letter-spacing:-.03em;color:#f6fbf8}
.calcResult[data-state="error"]{font-size:11px;color:#f09a91;letter-spacing:0}
.calcResult[data-state="idle"]{color:#82928f}
.calcCopy,.calcApprox{height:28px;padding:0 7px;border:1px solid #40555a;background:#1e2b32;color:#91aaa5;cursor:pointer;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:7px;font-weight:900;letter-spacing:.08em}
.calcApprox{color:#9cd2ca;border-color:#4d706b}
.calcCopy:hover,.calcApprox:hover{border-color:#68a79e;color:#d9ece8}
.calcApprox[hidden]{display:none}
.calcKeyboardHint{margin-top:8px;color:#738783;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:7px;line-height:1.35}
.calcFlash{animation:calcResultPulse .18s ease}
.calcErrorFlash{animation:calcErrorPulse .18s ease}
@keyframes calcResultPulse{50%{color:#83d4c8;transform:translateY(-1px)}}
@keyframes calcErrorPulse{50%{color:#ffb0a8}}

.calcKeys{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;padding:10px;background:#e8e1d4}
.calcKey{min-width:0;height:43px;border:1px solid #b9b0a1;background:#fbf7ee;color:#303936;cursor:pointer;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:850;transition:transform .055s ease,background .08s ease,border-color .08s ease,box-shadow .08s ease;box-shadow:0 1px 0 rgba(78,67,49,.08)}
.calcKey:hover{border-color:#8d9c93;background:#fffaf0}
.calcKey:active{transform:translateY(2px);box-shadow:none;background:#e1dbcf}
.calcKey.calcFn{font-size:9px;color:#47615b;background:#f3eee4}
.calcKey.calcOperator{color:#2f7774;background:#edf2ec;border-color:#aabdb5;font-size:16px}
.calcKey.calcDanger{color:#9a4f4f;background:#f5e9e4}
.calcKey.calcUtility{color:#795f46;background:#f3ecdf}
.calcKey.calcEquals{background:#2f7774;border-color:#2f7774;color:#fffaf0;font-size:18px;box-shadow:0 2px 0 #245f5b}
.calcKey.calcEquals:hover{background:#356f6c}
.calcKey.calcEquals:active{box-shadow:none}
.calcFooter{padding:8px 11px 10px;border-top:1px solid #c9c0b1;background:#f4eee2;display:flex;justify-content:space-between;gap:10px;color:#77766f;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:7px;line-height:1.35}

@media(max-width:1050px){
  .calculatorToggle{min-width:82px}
  .calculatorToggleMain span{display:none}
}
@media(max-width:780px){
  .calculatorToggle{display:none}
  .calculatorMobileToggle{display:grid;place-items:center}
  .scientificCalc{top:12px;right:10px;left:10px;width:auto;max-height:calc(100vh - 24px);transform-origin:bottom right}
  .calcTopbar{padding-left:10px}
}
@media(max-width:390px){
  .calcIdentity small{max-width:180px}
  .calcKeys{gap:4px;padding:8px}
  .calcKey{height:41px;font-size:11px}
  .calcFooter{display:block}
  .calcFooter span{display:block}
  .calcFooter span+span{margin-top:3px}
}
@media(prefers-reduced-motion:reduce){
  .scientificCalc,.calculatorToggle,.calculatorMobileToggle,.calcKey{transition:none}
  .calcFlash,.calcErrorFlash{animation:none}
}

/* ===== Calculator draggable window ===== */
.calcTopbar{cursor:grab;user-select:none;touch-action:none}
.scientificCalc.dragging .calcTopbar{cursor:grabbing}
.scientificCalc.dragging{transition:none!important;will-change:left,top}
.calcTopActions,.calcTopActions *{cursor:default}
.calcAngleOption,.calcCloseBtn{cursor:pointer}
.scientificCalc.positioned{right:auto}
@media(max-width:780px){
  .scientificCalc.positioned{right:auto;left:auto;width:min(410px,calc(100vw - 16px))}
}

@media(max-width:390px){
  .calcResultRow{grid-template-columns:auto minmax(0,1fr) auto}
  .calcCopy{display:none}
  .calcApprox{padding:0 6px}
}

  </style>
  <style>

  margin:0;
  padding:0;
  width:100%;
  height:auto;
  min-height:0;
  overflow:hidden;
  background:#f4eee2;
  color:#28312e;

  text-rendering:optimizeLegibility;

.scientificCalc,

}

}

}
.calcFooter span{display:block}
.calcFooter span+span{margin-top:3px}

@media(max-width:430px){
  .calcTopbar{padding-left:10px!important;padding-right:10px!important}
  .calcIdentity{gap:8px!important}
  .calcCode{width:38px!important;height:38px!important;flex-basis:38px!important}
  .calcIdentity strong{font-size:12px!important;letter-spacing:.045em!important}
  .calcIdentity small{font-size:6.5px!important}
  .calcAngleOption{min-width:42px!important;padding:0 6px!important}
  .calcCloseBtn{width:36px!important;flex-basis:36px!important}
  .calcDisplay{padding-left:12px!important;padding-right:12px!important}

}

@media(max-height:620px){
  .calcTopbar{min-height:58px!important;padding-top:8px!important;padding-bottom:8px!important}
  .calcCode{width:38px!important;height:38px!important;flex-basis:38px!important}
  .calcAngleSwitch{height:34px!important}
  .calcAngleOption{height:32px!important}
  .calcCloseBtn{width:34px!important;height:34px!important;flex-basis:34px!important}
  .calcDisplay{padding-top:11px!important;padding-bottom:9px!important}

<body>
  <div class="commandCenter" aria-hidden="true"></div>
  <div id="bootFallback" hidden style="padding:28px;font:600 13px/1.5 'Segoe UI',sans-serif;color:#675f54;background:#f4eee2;">
    Loading calculator…
  </div>
  <script>
(() => {
  'use strict';

  const commandCenter = document.querySelector('.commandCenter');
  if (!commandCenter || document.getElementById('scientificCalc')) return;

  const STORAGE_HISTORY = 'staticsCalcHistoryV1';
  const STORAGE_ANGLE = 'staticsCalcAngleV1';
  const STORAGE_POSITION = 'staticsCalcPositionV1';
  const MAX_HISTORY = 30;
  let ans = 0;
  let history = [];
  let historyCursor = 0;
  let angleMode = 'DEG';
  try { angleMode = localStorage.getItem(STORAGE_ANGLE) === 'RAD' ? 'RAD' : 'DEG'; } catch (_) {}
  let previewFrame = 0;
  let lastResultValue = 0;
  let lastExactResult = null;
  let resultView = 'exact';

  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_HISTORY) || '[]');
    if (Array.isArray(saved)) history = saved.slice(-MAX_HISTORY).filter(x => x && typeof x.expression === 'string');
  } catch (_) {}
  historyCursor = history.length;
  if (history.length && Number.isFinite(history[history.length - 1].value)) ans = history[history.length - 1].value;

  const toggle = document.createElement('button');
  toggle.id = 'calculatorToggle';
  toggle.className = 'calculatorToggle';
  toggle.type = 'button';
  toggle.title = 'Scientific calculator · Alt+C';
  toggle.setAttribute('aria-haspopup', 'dialog');
  toggle.setAttribute('aria-expanded', 'false');
  toggle.innerHTML = '<span class="calculatorToggleTop">CALCULATOR</span><span class="calculatorToggleMain"><b>ƒx</b><span>ALT+C</span></span>';
  commandCenter.insertBefore(toggle, commandCenter.firstChild);

  const mobileToggle = document.createElement('button');
  mobileToggle.id = 'calculatorMobileToggle';
  mobileToggle.className = 'calculatorMobileToggle';
  mobileToggle.type = 'button';
  mobileToggle.title = 'Open scientific calculator';
  mobileToggle.setAttribute('aria-label', 'Open scientific calculator');
  mobileToggle.textContent = 'ƒx';
  document.body.appendChild(mobileToggle);

  const panel = document.createElement('section');
  panel.id = 'scientificCalc';
  panel.className = 'scientificCalc';
  panel.setAttribute('role', 'dialog');
  panel.setAttribute('aria-label', 'Scientific calculator');
  panel.setAttribute('aria-hidden', 'true');
  panel.innerHTML = `
    <div class="calcTopbar">
      <div class="calcIdentity">
        <span class="calcCode">SC-01</span>
        <div><strong>Scientific Calculator</strong><small>DRAG HERE TO MOVE · ALT+C · ENTER = SOLVE</small></div>
      </div>
      <div class="calcTopActions">
        <div class="calcAngleSwitch" role="group" aria-label="Angle unit">
          <button class="calcAngleOption" type="button" data-angle-mode="DEG" aria-pressed="true">DEG</button>
          <button class="calcAngleOption" type="button" data-angle-mode="RAD" aria-pressed="false">RAD</button>
        </div>
        <button class="calcCloseBtn" id="calcClose" type="button" aria-label="Close calculator">×</button>
      </div>
    </div>
    <div class="calcDisplay">
      <div class="calcDisplayMeta">
        <span id="calcModeReadout">DEG MODE</span>
        <span id="calcHistoryReadout">NO HISTORY</span>
      </div>
      <label class="calcInputWrap">
        <span class="srOnly">Calculator expression</span>
        <input id="calcExpression" class="calcExpression" inputmode="text" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="calcKeyboardHint" placeholder="e.g. 2*cos(35) + 4^2" />
      </label>
      <div class="calcResultRow">
        <span>=</span>
        <output id="calcResult" class="calcResult" aria-live="polite">0</output>
        <button id="calcApprox" class="calcApprox" type="button" title="Show decimal approximation" hidden>DECIMAL</button>
        <button id="calcCopy" class="calcCopy" type="button" title="Copy result">COPY</button>
      </div>
      <div id="calcKeyboardHint" class="calcKeyboardHint">← → move cursor · Home/End jump · Ctrl/Cmd+C/V/X/A work normally</div>
    </div>
    <div class="calcKeys" aria-label="Calculator keypad">
      <button type="button" class="calcKey calcFn" data-insert="sin(">sin</button>
      <button type="button" class="calcKey calcFn" data-insert="cos(">cos</button>
      <button type="button" class="calcKey calcFn" data-insert="tan(">tan</button>
      <button type="button" class="calcKey calcFn" data-insert="sqrt(">√</button>
      <button type="button" class="calcKey calcFn" data-action="square">x²</button>

      <button type="button" class="calcKey calcFn" data-insert="asin(">sin⁻¹</button>
      <button type="button" class="calcKey calcFn" data-insert="acos(">cos⁻¹</button>
      <button type="button" class="calcKey calcFn" data-insert="atan(">tan⁻¹</button>
      <button type="button" class="calcKey calcFn" data-insert="ln(">ln</button>
      <button type="button" class="calcKey calcFn" data-insert="log(">log</button>

      <button type="button" class="calcKey calcFn" data-insert="(">(</button>
      <button type="button" class="calcKey calcFn" data-insert=")">)</button>
      <button type="button" class="calcKey calcFn" data-insert="^">xʸ</button>
      <button type="button" class="calcKey calcFn" data-insert="pi">π</button>
      <button type="button" class="calcKey calcFn" data-insert="e">e</button>

      <button type="button" class="calcKey" data-insert="7">7</button>
      <button type="button" class="calcKey" data-insert="8">8</button>
      <button type="button" class="calcKey" data-insert="9">9</button>
      <button type="button" class="calcKey calcOperator" data-insert="/">÷</button>
      <button type="button" class="calcKey calcDanger" data-action="clear">AC</button>

      <button type="button" class="calcKey" data-insert="4">4</button>
      <button type="button" class="calcKey" data-insert="5">5</button>
      <button type="button" class="calcKey" data-insert="6">6</button>
      <button type="button" class="calcKey calcOperator" data-insert="*">×</button>
      <button type="button" class="calcKey calcUtility" data-action="backspace">⌫</button>

      <button type="button" class="calcKey" data-insert="1">1</button>
      <button type="button" class="calcKey" data-insert="2">2</button>
      <button type="button" class="calcKey" data-insert="3">3</button>
      <button type="button" class="calcKey calcOperator" data-insert="-">−</button>
      <button type="button" class="calcKey calcUtility" data-insert="ans">ANS</button>

      <button type="button" class="calcKey" data-insert="0">0</button>
      <button type="button" class="calcKey" data-insert=".">.</button>
      <button type="button" class="calcKey calcFn" data-action="sign">±</button>
      <button type="button" class="calcKey calcOperator" data-insert="+">+</button>
      <button type="button" class="calcKey calcEquals" data-action="equals">=</button>
    </div>
    <div class="calcFooter">
      <span>Supports implicit multiply: 2π, 3(4+1), 2sin(30)</span>
      <span>Exact roots/fractions shown first · DECIMAL toggles approximation</span>
    </div>
  `;
  document.body.appendChild(panel);

  const topbar = panel.querySelector('.calcTopbar');
  const input = panel.querySelector('#calcExpression');
  const result = panel.querySelector('#calcResult');
  const modeButtons = [...panel.querySelectorAll('[data-angle-mode]')];
  const modeReadout = panel.querySelector('#calcModeReadout');
  const historyReadout = panel.querySelector('#calcHistoryReadout');
  const copyBtn = panel.querySelector('#calcCopy');
  const approxBtn = panel.querySelector('#calcApprox');

  function isOpen() {
    return panel.classList.contains('open');
  }

  function clampPosition(left, top) {
    const rect = panel.getBoundingClientRect();
    const margin = 8;
    const width = Math.min(rect.width || 410, window.innerWidth - margin * 2);
    const height = Math.min(rect.height || 500, window.innerHeight - margin * 2);
    return {
      left: Math.max(margin, Math.min(left, window.innerWidth - width - margin)),
      top: Math.max(margin, Math.min(top, window.innerHeight - height - margin))
    };
  }

  function setPanelPosition(left, top, {save=true}={}) {
    const next = clampPosition(left, top);
    panel.style.left = next.left + 'px';
    panel.style.top = next.top + 'px';
    panel.style.right = 'auto';
    panel.classList.add('positioned');
    if (save) {
      try {
        localStorage.setItem(STORAGE_POSITION, JSON.stringify(next));
      } catch (_) {}
    }
  }

  function restorePanelPosition() {
    let saved = null;
    try {
      saved = JSON.parse(localStorage.getItem(STORAGE_POSITION) || 'null');
    } catch (_) {}
    if (saved && Number.isFinite(saved.left) && Number.isFinite(saved.top)) {
      setPanelPosition(saved.left, saved.top, {save:false});
    }
  }

  function resetPanelPosition() {
    panel.classList.remove('positioned');
    panel.style.left = '';
    panel.style.top = '';
    panel.style.right = '';
    try { localStorage.removeItem(STORAGE_POSITION); } catch (_) {}
  }

  let dragState = null;
  topbar.addEventListener('pointerdown', event => {
    if (event.button !== 0 || event.target.closest('button')) return;
    const rect = panel.getBoundingClientRect();
    dragState = {
      pointerId: event.pointerId,
      offsetX: event.clientX - rect.left,
      offsetY: event.clientY - rect.top
    };
    panel.style.width = rect.width + 'px';
    panel.classList.add('dragging');
    topbar.setPointerCapture(event.pointerId);
    event.preventDefault();
  });

  topbar.addEventListener('pointermove', event => {
    if (!dragState || dragState.pointerId !== event.pointerId) return;
    setPanelPosition(event.clientX - dragState.offsetX, event.clientY - dragState.offsetY);
  });

  function finishDrag(event) {
    if (!dragState || dragState.pointerId !== event.pointerId) return;
    dragState = null;
    panel.classList.remove('dragging');
    try { topbar.releasePointerCapture(event.pointerId); } catch (_) {}
  }

  topbar.addEventListener('pointerup', finishDrag);
  topbar.addEventListener('pointercancel', finishDrag);
  topbar.addEventListener('dblclick', event => {
    if (event.target.closest('button')) return;
    resetPanelPosition();
  });

  window.addEventListener('resize', () => {
    if (!panel.classList.contains('positioned')) return;
    const rect = panel.getBoundingClientRect();
    setPanelPosition(rect.left, rect.top, {save:true});
  });

  function setOpen(next) {
    panel.classList.toggle('open', next);
    panel.setAttribute('aria-hidden', next ? 'false' : 'true');
    toggle.setAttribute('aria-expanded', next ? 'true' : 'false');
    mobileToggle.setAttribute('aria-expanded', next ? 'true' : 'false');
    if (next) {
      requestAnimationFrame(() => {
        restorePanelPosition();
        input.focus({preventScroll: true});
        input.setSelectionRange(input.value.length, input.value.length);
      });
    }
  }

  function toggleOpen() {
    setOpen(!isOpen());
  }

  function setAngleMode(mode) {
    angleMode = mode === 'RAD' ? 'RAD' : 'DEG';
    modeButtons.forEach(button => {
      const active = button.dataset.angleMode === angleMode;
      button.classList.toggle('active', active);
      button.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
    modeReadout.textContent = angleMode + ' MODE';
    try { localStorage.setItem(STORAGE_ANGLE, angleMode); } catch (_) {}
    schedulePreview();
  }

  function saveHistory() {
    try {
      localStorage.setItem(STORAGE_HISTORY, JSON.stringify(history.slice(-MAX_HISTORY)));
    } catch (_) {}
  }

  function updateHistoryReadout() {
    historyReadout.textContent = history.length ? history.length + ' SAVED' : 'NO HISTORY';
  }

  function flash(el, className = 'calcFlash') {
    el.classList.remove(className);
    void el.offsetWidth;
    el.classList.add(className);
    setTimeout(() => el.classList.remove(className), 180);
  }

  function normalizeExpression(value) {
    return value
      .replace(/π/g, 'pi')
      .replace(/[×·]/g, '*')
      .replace(/÷/g, '/')
      .replace(/[−–—]/g, '-');
  }

  function tokenize(source) {
    source = normalizeExpression(source);
    const tokens = [];
    let i = 0;
    while (i < source.length) {
      const rest = source.slice(i);
      const ch = source[i];
      if (/\s/.test(ch)) { i++; continue; }

      const number = rest.match(/^(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?/);
      if (number) {
        tokens.push({type: 'number', value: Number(number[0])});
        i += number[0].length;
        continue;
      }

      const ident = rest.match(/^[A-Za-z_][A-Za-z0-9_]*/);
      if (ident) {
        tokens.push({type: 'id', value: ident[0].toLowerCase()});
        i += ident[0].length;
        continue;
      }

      if ('+-*/^()!%'.includes(ch)) {
        tokens.push({type: ch, value: ch});
        i++;
        continue;
      }

      throw new Error('Unsupported symbol: ' + ch);
    }
    tokens.push({type: 'eof', value: ''});
    return tokens;
  }

  function evaluateExpression(source) {
    if (!source.trim()) return 0;
    const tokens = tokenize(source);
    let pos = 0;
    const peek = () => tokens[pos];
    const take = type => {
      if (peek().type !== type) throw new Error('Expected ' + type);
      return tokens[pos++];
    };

    const toAngle = x => angleMode === 'DEG' ? x * Math.PI / 180 : x;
    const fromAngle = x => angleMode === 'DEG' ? x * 180 / Math.PI : x;
    const snapTrig = value => {
      if (Math.abs(value) < 1e-12) return 0;
      if (Math.abs(value - 1) < 1e-12) return 1;
      if (Math.abs(value + 1) < 1e-12) return -1;
      return value;
    };
    const functions = {
      sin: x => snapTrig(Math.sin(toAngle(x))),
      cos: x => snapTrig(Math.cos(toAngle(x))),
      tan: x => {
        const a = toAngle(x);
        const cosine = Math.cos(a);
        if (Math.abs(cosine) < 1e-12) throw new Error('Undefined');
        return snapTrig(Math.sin(a) / cosine);
      },
      asin: x => fromAngle(Math.asin(x)),
      acos: x => fromAngle(Math.acos(x)),
      atan: x => fromAngle(Math.atan(x)),
      sqrt: x => Math.sqrt(x),
      ln: x => Math.log(x),
      log: x => Math.log10(x),
      abs: x => Math.abs(x),
      exp: x => Math.exp(x),
      floor: x => Math.floor(x),
      ceil: x => Math.ceil(x),
      round: x => Math.round(x)
    };

    function startsPrimary(token) {
      return token.type === 'number' || token.type === 'id' || token.type === '(';
    }

    function factorial(n) {
      if (!Number.isInteger(n) || n < 0) throw new Error('Factorial needs a non-negative integer');
      if (n > 170) throw new Error('Factorial is too large');
      let out = 1;
      for (let k = 2; k <= n; k++) out *= k;
      return out;
    }

    function primary() {
      const token = peek();
      if (token.type === 'number') {
        pos++;
        return token.value;
      }
      if (token.type === '(') {
        pos++;
        const value = addSub();
        take(')');
        return value;
      }
      if (token.type === 'id') {
        pos++;
        const name = token.value;
        if (name === 'pi') return Math.PI;
        if (name === 'e') return Math.E;
        if (name === 'ans') return ans;
        const fn = functions[name];
        if (!fn) throw new Error('Unknown function: ' + name);
        take('(');
        const arg = addSub();
        take(')');
        const value = fn(arg);
        if (!Number.isFinite(value)) throw new Error('Result is outside the real-number range');
        return value;
      }
      throw new Error('Expected a number, constant, or function');
    }

    function postfix() {
      let value = primary();
      while (peek().type === '!' || peek().type === '%') {
        if (peek().type === '!') {
          pos++;
          value = factorial(value);
        } else {
          pos++;
          value /= 100;
        }
      }
      return value;
    }

    function power() {
      let value = postfix();
      if (peek().type === '^') {
        pos++;
        value = Math.pow(value, unary());
      }
      return value;
    }

    function unary() {
      if (peek().type === '+') { pos++; return unary(); }
      if (peek().type === '-') { pos++; return -unary(); }
      return power();
    }

    function multiplyDivide() {
      let value = unary();
      while (true) {
        if (peek().type === '*') {
          pos++;
          value *= unary();
        } else if (peek().type === '/') {
          pos++;
          const divisor = unary();
          if (divisor === 0) throw new Error('Division by zero');
          value /= divisor;
        } else if (startsPrimary(peek())) {
          value *= unary();
        } else {
          break;
        }
      }
      return value;
    }

    function addSub() {
      let value = multiplyDivide();
      while (peek().type === '+' || peek().type === '-') {
        const op = tokens[pos++].type;
        const right = multiplyDivide();
        value = op === '+' ? value + right : value - right;
      }
      return value;
    }

    const value = addSub();
    if (peek().type !== 'eof') throw new Error('Unexpected input');
    if (!Number.isFinite(value)) throw new Error('Result is outside the real-number range');
    return Object.is(value, -0) ? 0 : value;
  }

  function gcd(a, b) {
    a = Math.abs(Math.trunc(a));
    b = Math.abs(Math.trunc(b));
    while (b) [a, b] = [b, a % b];
    return a || 1;
  }

  function near(a, b) {
    return Math.abs(a - b) <= 1e-12 * Math.max(1, Math.abs(a), Math.abs(b));
  }

  function formatFraction(n, d) {
    if (d === 1) return String(n);
    return n + '/' + d;
  }

  function formatPiMultiple(n, d) {
    const sign = n < 0 ? '-' : '';
    n = Math.abs(n);
    const g = gcd(n, d);
    n /= g;
    d /= g;
    const coeff = n === 1 ? '' : String(n);
    if (d === 1) return sign + coeff + 'π';
    return sign + (coeff || '') + 'π/' + d;
  }

  function formatRadicalMultiple(n, d, radicand) {
    const sign = n < 0 ? '-' : '';
    n = Math.abs(n);
    const g = gcd(n, d);
    n /= g;
    d /= g;
    const coeff = n === 1 ? '' : String(n);
    const radical = coeff + '√' + radicand;
    return sign + (d === 1 ? radical : radical + '/' + d);
  }

  function exactResultForValue(value) {
    if (!Number.isFinite(value)) return null;
    if (near(value, Math.round(value))) return null;

    // Prefer simple rational answers when they are genuinely exact-looking.
    for (let d = 2; d <= 48; d++) {
      const n = Math.round(value * d);
      if (Math.abs(n) > 100000) continue;
      if (near(value, n / d)) {
        const g = gcd(n, d);
        return formatFraction(n / g, d / g);
      }
    }

    // Common exact radian answers such as π/6, 2π/3, -π/2.
    for (let d = 1; d <= 24; d++) {
      const n = Math.round(value * d / Math.PI);
      if (!n || Math.abs(n) > 48) continue;
      if (near(value, n * Math.PI / d)) return formatPiMultiple(n, d);
    }

    // Radical forms such as √2, √3/2, 2√3, 3√2/2.
    const squareFree = [];
    for (let r = 2; r <= 50; r++) {
      let sf = true;
      for (let k = 2; k * k <= r; k++) {
        if (r % (k * k) === 0) { sf = false; break; }
      }
      if (sf) squareFree.push(r);
    }
    for (const r of squareFree) {
      const root = Math.sqrt(r);
      for (let d = 1; d <= 24; d++) {
        const n = Math.round(value * d / root);
        if (!n || Math.abs(n) > 96) continue;
        if (near(value, n * root / d)) return formatRadicalMultiple(n, d, r);
      }
    }

    return null;
  }

  function updateResultDisplay() {
    const numeric = formatResult(lastResultValue);
    const hasExact = !!lastExactResult && lastExactResult !== numeric;
    approxBtn.hidden = !hasExact;
    if (!hasExact) {
      result.textContent = numeric;
      resultView = 'exact';
      return;
    }
    if (resultView === 'decimal') {
      result.textContent = numeric;
      approxBtn.textContent = 'EXACT';
      approxBtn.title = 'Show exact value';
    } else {
      result.textContent = lastExactResult;
      approxBtn.textContent = 'DECIMAL';
      approxBtn.title = 'Show decimal approximation';
    }
  }

  function formatResult(value) {
    if (!Number.isFinite(value)) return 'ERROR';
    if (value === 0) return '0';
    const a = Math.abs(value);
    if (a >= 1e12 || a < 1e-9) return value.toExponential(10).replace(/\.0+e/, 'e').replace(/(\.\d*?[1-9])0+e/, '$1e');
    return Number(value.toPrecision(12)).toString();
  }

  function showResult(value, explicit = false) {
    lastResultValue = value;
    lastExactResult = exactResultForValue(value);
    resultView = 'exact';
    updateResultDisplay();
    result.dataset.state = 'ok';
    if (explicit) flash(result);
  }

  function showError(message) {
    lastExactResult = null;
    approxBtn.hidden = true;
    result.textContent = message || 'ERROR';
    result.dataset.state = 'error';
    flash(result, 'calcErrorFlash');
  }

  function preview() {
    cancelAnimationFrame(previewFrame);
    previewFrame = requestAnimationFrame(() => {
      const expression = input.value.trim();
      if (!expression) {
        lastResultValue = 0;
        lastExactResult = null;
        resultView = 'exact';
        approxBtn.hidden = true;
        result.textContent = '0';
        result.dataset.state = 'ok';
        return;
      }
      try {
        showResult(evaluateExpression(expression), false);
      } catch (_) {
        result.textContent = '—';
        result.dataset.state = 'idle';
      }
    });
  }

  function schedulePreview() {
    preview();
  }

  function commitCalculation() {
    const expression = input.value.trim();
    if (!expression) return;
    try {
      const value = evaluateExpression(expression);
      ans = value;
      const formatted = exactResultForValue(value) || formatResult(value);
      const last = history[history.length - 1];
      if (!last || last.expression !== expression || last.result !== formatted || last.mode !== angleMode) {
        history.push({expression, result: formatted, value, mode: angleMode});
        if (history.length > MAX_HISTORY) history.shift();
        saveHistory();
      }
      historyCursor = history.length;
      updateHistoryReadout();
      showResult(value, true);
    } catch (err) {
      showError(err instanceof Error ? err.message : 'Invalid expression');
    }
  }

  function insertText(text) {
    input.focus({preventScroll: true});
    const start = input.selectionStart ?? input.value.length;
    const end = input.selectionEnd ?? start;
    input.setRangeText(text, start, end, 'end');
    historyCursor = history.length;
    input.dispatchEvent(new Event('input', {bubbles: true}));
  }

  function backspace() {
    input.focus({preventScroll: true});
    const start = input.selectionStart ?? input.value.length;
    const end = input.selectionEnd ?? start;
    if (start !== end) {
      input.setRangeText('', start, end, 'end');
    } else if (start > 0) {
      input.setRangeText('', start - 1, start, 'end');
    }
    input.dispatchEvent(new Event('input', {bubbles: true}));
  }

  function squareSelection() {
    input.focus({preventScroll: true});
    const start = input.selectionStart ?? input.value.length;
    const end = input.selectionEnd ?? start;
    if (start !== end) {
      const selected = input.value.slice(start, end);
      input.setRangeText('(' + selected + ')^2', start, end, 'end');
    } else {
      insertText('^2');
      return;
    }
    input.dispatchEvent(new Event('input', {bubbles: true}));
  }

  function toggleSign() {
    input.focus({preventScroll: true});
    const start = input.selectionStart ?? input.value.length;
    const end = input.selectionEnd ?? start;
    if (start !== end) {
      const selected = input.value.slice(start, end);
      input.setRangeText('-(' + selected + ')', start, end, 'end');
    } else {
      insertText('-');
      return;
    }
    input.dispatchEvent(new Event('input', {bubbles: true}));
  }

  function clearInput() {
    input.value = '';
    historyCursor = history.length;
    input.focus({preventScroll: true});
    preview();
  }

  function browseHistory(direction) {
    if (!history.length) return;
    if (direction < 0) {
      historyCursor = Math.max(0, historyCursor - 1);
    } else {
      historyCursor = Math.min(history.length, historyCursor + 1);
    }
    if (historyCursor === history.length) {
      input.value = '';
    } else {
      const entry = history[historyCursor];
      input.value = entry.expression;
      if (entry.mode) setAngleMode(entry.mode);
    }
    input.setSelectionRange(input.value.length, input.value.length);
    preview();
  }

  async function copyResult() {
    const text = result.dataset.state === 'ok' ? result.textContent : '';
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
      copyBtn.textContent = 'COPIED';
    } catch (_) {
      input.focus({preventScroll: true});
      input.select();
      copyBtn.textContent = 'SELECTED';
    }
    setTimeout(() => { copyBtn.textContent = 'COPY'; }, 850);
  }

  panel.querySelectorAll('.calcKey').forEach(button => {
    button.addEventListener('click', () => {
      const insert = button.dataset.insert;
      const action = button.dataset.action;
      if (insert != null) insertText(insert);
      else if (action === 'equals') commitCalculation();
      else if (action === 'clear') clearInput();
      else if (action === 'backspace') backspace();
      else if (action === 'square') squareSelection();
      else if (action === 'sign') toggleSign();
      if (navigator.vibrate) navigator.vibrate(4);
    });
  });

  input.addEventListener('input', () => {
    historyCursor = history.length;
    schedulePreview();
  });

  input.addEventListener('keydown', event => {
    if ((event.ctrlKey || event.metaKey) && ['a', 'c', 'v', 'x'].includes(event.key.toLowerCase())) return;
    if (event.key === 'Enter') {
      event.preventDefault();
      commitCalculation();
    } else if (event.key === 'ArrowUp') {
      event.preventDefault();
      browseHistory(-1);
    } else if (event.key === 'ArrowDown') {
      event.preventDefault();
      browseHistory(1);
    } else if (event.key === 'Escape') {
      event.preventDefault();
      setOpen(false);
    }
  });

  document.addEventListener('keydown', event => {
    if (event.altKey && !event.ctrlKey && !event.metaKey && event.key.toLowerCase() === 'c') {
      event.preventDefault();
      toggleOpen();
    } else if (event.key === 'Escape' && isOpen() && document.activeElement !== input) {
      setOpen(false);
    }
  });

  toggle.addEventListener('click', toggleOpen);
  mobileToggle.addEventListener('click', toggleOpen);
  panel.querySelector('#calcClose').addEventListener('click', () => setOpen(false));
  modeButtons.forEach(button => button.addEventListener('click', () => setAngleMode(button.dataset.angleMode)));
  approxBtn.addEventListener('click', () => {
    if (!lastExactResult) return;
    resultView = resultView === 'exact' ? 'decimal' : 'exact';
    updateResultDisplay();
    flash(result);
  });
  copyBtn.addEventListener('click', copyResult);

  setAngleMode(angleMode);
  updateHistoryReadout();
  preview();
})();
  </script>
  <script>
(() => {
  'use strict';

  const toggle = document.getElementById('calculatorToggle');
  const panel = document.getElementById('scientificCalc');
  const close = document.getElementById('calcClose');
  const input = document.getElementById('calcExpression');
  const topbar = panel?.querySelector('.calcTopbar');
  const host = window.chrome?.webview;
  const fallback = document.getElementById('bootFallback');

  const send = (message) => {
    try { host?.postMessage(message); } catch (_) {}
  };

  if (!panel) {
    if (fallback) {
      fallback.hidden = false;
      fallback.textContent = 'Calculator failed to initialize. Please reopen the app.';
    }
    send('fit:220');
    return;
  }

  if (fallback) fallback.remove();
  if (toggle && !panel.classList.contains('open')) toggle.click();

  if (close) {
    close.addEventListener('click', (event) => {
      event.preventDefault();
      event.stopImmediatePropagation();
      send('close');
    }, true);
  }

  if (topbar) {
    topbar.addEventListener('pointerdown', (event) => {
      if (event.button !== 0) return;
      if (event.target.closest('button,input,a,[role="button"]')) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      send('drag');
    }, true);
  }

  window.addEventListener('keydown', (event) => {
    const altC = event.altKey && !event.ctrlKey && !event.metaKey && String(event.key || '').toLowerCase() === 'c';
    if (altC) {
      event.preventDefault();
      event.stopImmediatePropagation();
      return;
    }
    if (event.key === 'Escape') {
      event.preventDefault();
      event.stopImmediatePropagation();
      send('close');
    }
  }, true);

  let lastHeight = 0;
  let fitTimer = 0;
  const requestFit = () => {
    clearTimeout(fitTimer);
    fitTimer = setTimeout(() => {
      const rect = panel?.getBoundingClientRect();
      const height = Math.ceil(rect?.height || panel?.scrollHeight || 0);
      if (Math.abs(height - lastHeight) < 2) return;
      lastHeight = height;
      send('fit:' + height);
    }, 20);
  };

  requestAnimationFrame(() => {
    input?.focus({ preventScroll: true });
    if (input) input.setSelectionRange(input.value.length, input.value.length);
    requestFit();
  });

  window.addEventListener('load', requestFit, { once: true });
  if (window.ResizeObserver && panel) {
    new ResizeObserver(requestFit).observe(panel);
  }

  if (document.fonts?.ready) document.fonts.ready.then(requestFit);
})();

  </script>
