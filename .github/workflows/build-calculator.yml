name: Build Windows Calculator

on:
  push:
    branches: [main]
    paths:
      - "desktop-calculator/**"
      - ".github/workflows/build-calculator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-calculator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Decode app icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          [IO.File]::WriteAllBytes("build/icon.png", [Convert]::FromBase64String(""))

      - name: Install Electron builder
        run: npm install --no-audit --no-fund --save-dev electron@latest electron-builder@latest

      - name: Build portable EXE
        run: npx electron-builder --win portable --x64

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: Statics-Calculator-Windows
          path: desktop-calculator/dist/*.exe
          if-no-files-found: error
          retention-days: 30
