name: Verify Statics Lab deployment

on:
  workflow_run:
    workflows: ["Deploy Statics Lab to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Verify calculator JavaScript syntax
        run: node --check public/calculator.js

      - name: Verify calculator mode and trig guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data-angle-mode="DEG"' public/calculator.js
          grep -q 'data-angle-mode="RAD"' public/calculator.js
          grep -q "Math.abs(value) < 1e-12" public/calculator.js
          grep -q "Math.abs(cosine) < 1e-12" public/calculator.js

      - name: Verify calculator exact result mode
        shell: bash
        run: |
          set -euo pipefail
          grep -q "exactResultForValue" public/calculator.js
          grep -q "formatRadicalMultiple" public/calculator.js
          grep -q "calcApprox" public/calculator.js
          grep -q "DECIMAL" public/calculator.js
          grep -q "calcApprox" public/calculator.css

      - name: Verify calculator drag support
        shell: bash
        run: |
          set -euo pipefail
          grep -q "STORAGE_POSITION" public/calculator.js
          grep -q "pointerdown" public/calculator.js
          grep -q "setPointerCapture" public/calculator.js
          grep -q "setPanelPosition" public/calculator.js
          grep -q "cursor:grab" public/calculator.css

      - name: Verify clean 3D decomposition panel v3
        shell: bash
        run: |
          set -euo pipefail
          grep -q "DECOMPOSE IN 2 STEPS" public/statics-diagrams.js
          grep -q "sdDecompPanel" public/statics-diagrams.js
          grep -q "sdStepDivider" public/statics-diagrams.js
          grep -q "Clean 3D decomposition panel v3" public/content.css

      - name: Verify clean 3D force diagram
        shell: bash
        run: |
          set -euo pipefail
          grep -q "1 · VERTICAL" public/statics-diagrams.js
          grep -q "2 · HORIZONTAL" public/statics-diagrams.js
          grep -q "sdComponentY" public/statics-diagrams.js
          grep -q "horizontal projection" public/statics-diagrams.js
          grep -q "Clear two-stage 3D force decomposition" public/content.css

      - name: Verify reusable statics diagram engine
        shell: bash
        run: |
          set -euo pipefail
          node --check public/statics-diagrams.js
          node --check public/quiz1-upgrade.js
          grep -q "window.StaticsDiagrams" public/statics-diagrams.js
          grep -q "StaticsDiagrams.force3D" public/quiz1-upgrade.js
          grep -q "Reusable Statics vector-diagram engine" public/content.css
          grep -q 'src="./statics-diagrams.js?v=5"' public/index.html

      - name: Verify visual explanation layer
        shell: bash
        run: |
          set -euo pipefail
          node --check public/visual-explanations.js
          grep -q "VISUAL EXPLANATION" public/visual-explanations.js
          grep -q "data-vx-components" public/visual-explanations.js
          grep -q "data-vx-moment" public/visual-explanations.js
          grep -q "vxSupports" public/visual-explanations.css

      - name: Verify Ctrl-drag whiteboard panning
        shell: bash
        run: |
          set -euo pipefail
          node --check public/whiteboard-pro.js
          grep -q "keyboardPan=false" public/whiteboard-pro.js
          grep -q "setKeyboardPan(on)" public/whiteboard-pro.js
          grep -q "key==='control'" public/whiteboard-pro.js
          grep -q "e.pointerType==='mouse'&&e.ctrlKey" public/whiteboard-pro.js

      - name: Verify instant whiteboard clear
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "Clear this whiteboard" public/whiteboard-pro.js; then
            echo "Whiteboard clear confirmation still present"
            exit 1
          fi
          grep -q "clear(){if(!this.board().strokes.length)return;this.pushHistory()" public/whiteboard-pro.js

      - name: Verify fullscreen question diagrams
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Fullscreen question diagram repair" public/content.css
          grep -q "fullscreenProblemDiagram .qd-force" public/content.css
          grep -q "fullscreenProblemDiagram .qd-line" public/content.css
          grep -q "grid-template-areas" public/content.css

      - name: Verify worked-example visuals
        shell: bash
        run: |
          set -euo pipefail
          node --check public/worked-example-visuals.js
          grep -q "Two-force resultant: 40 N and 60 N" public/worked-example-visuals.js
          grep -q "Equilibrium examples from the lecture" public/worked-example-visuals.js
          grep -q "2500-N guy wire" public/worked-example-visuals.js
          grep -q "Beam force-system reduction" public/worked-example-visuals.js
          grep -q "Four complete synthesis examples" public/worked-example-visuals.js

      - name: Verify subtle old-PC styling
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Subtle old-PC workstation polish" public/old-pc.css
          grep -q "repeating-linear-gradient" public/old-pc.css
          grep -q "outline:1px dotted" public/old-pc.css
          grep -q "prefers-reduced-motion" public/old-pc.css

      - name: Verify deployed frontend byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://weather-mister.github.io/statics-lab"

          check_file() {
            local remote_path="$1"
            local local_path="$2"
            local tmp
            tmp="$(mktemp)"
            curl --fail --silent --show-error --location --retry 8 --retry-delay 2 --retry-all-errors \
              "$BASE/$remote_path?verify=$GITHUB_SHA" -o "$tmp"
            cmp --silent "$local_path" "$tmp" || {
              echo "::error::$remote_path differs from the repository copy"
              exit 1
            }
            echo "OK $remote_path"
          }

          check_file "" "public/index.html"
          check_file "app.js" "public/app.js"
          check_file "audit-fixes.js" "public/audit-fixes.js"
          check_file "calculator.css" "public/calculator.css"
          check_file "calculator.js" "public/calculator.js"
          check_file "visual-explanations.css" "public/visual-explanations.css"
          check_file "visual-explanations.js" "public/visual-explanations.js"
          check_file "worked-example-visuals.css" "public/worked-example-visuals.css"
          check_file "worked-example-visuals.js" "public/worked-example-visuals.js"
          check_file "old-pc.css" "public/old-pc.css"
          check_file "content.css" "public/content.css"
          check_file "favicon.svg" "public/favicon.svg"
          check_file "prequiz-content.js" "public/prequiz-content.js"
          check_file "quiz1-upgrade.js" "public/quiz1-upgrade.js"
          check_file "statics-diagrams.js" "public/statics-diagrams.js"
          check_file "styles.css" "public/styles.css"
          check_file "teaching-depth.js" "public/teaching-depth.js"
          check_file "whiteboard-pro.js" "public/whiteboard-pro.js"
          check_file "vendor/mathjax-tex-svg.js" "public/vendor/mathjax-tex-svg.js"

          curl --fail --silent --show-error --location --retry 8 --retry-delay 2 --retry-all-errors \
            "$BASE/?verify=$GITHUB_SHA" -o /tmp/live-index.html
          grep -q '<title>Statics Lab</title>' /tmp/live-index.html
          grep -q 'src="./app.js?v=34"' /tmp/live-index.html
          grep -q 'href="./styles.css?v=22"' /tmp/live-index.html
          grep -q 'src="./vendor/mathjax-tex-svg.js?v=22"' /tmp/live-index.html
          grep -q 'href="./calculator.css?v=4"' /tmp/live-index.html
          grep -q 'src="./calculator.js?v=4"' /tmp/live-index.html
          grep -q 'href="./visual-explanations.css?v=1"' /tmp/live-index.html
          grep -q 'src="./visual-explanations.js?v=1"' /tmp/live-index.html
          grep -q 'href="./worked-example-visuals.css?v=1"' /tmp/live-index.html
          grep -q 'src="./worked-example-visuals.js?v=1"' /tmp/live-index.html
          grep -q 'href="./old-pc.css?v=1"' /tmp/live-index.html
          echo "OK index.html and GitHub Pages path rewriting"

      - name: Verify Supabase profile backend and CORS
        shell: bash
        run: |
          set -euo pipefail
          SUPABASE_URL="$(node -e "const s=require('fs').readFileSync('public/app.js','utf8'); const m=s.match(/const SUPABASE_URL = '([^']+)'/); if(!m) process.exit(1); process.stdout.write(m[1])")"
          SUPABASE_KEY="$(node -e "const s=require('fs').readFileSync('public/app.js','utf8'); const m=s.match(/const SUPABASE_PUBLISHABLE_KEY = '([^']+)'/); if(!m) process.exit(1); process.stdout.write(m[1])")"

          code="$(curl --silent --show-error \
            --dump-header /tmp/backend-headers.txt \
            --output /tmp/backend-body.txt \
            --write-out '%{http_code}' \
            --request POST "$SUPABASE_URL/rest/v1/rpc/load_statics_profile_v1" \
            --header "apikey: $SUPABASE_KEY" \
            --header "Content-Type: application/json" \
            --header "Origin: https://weather-mister.github.io" \
            --data '{"p_username":"x"}')"

          test "$code" = "400"
          grep -qi 'invalid_username' /tmp/backend-body.txt
          grep -qi '^access-control-allow-origin:' /tmp/backend-headers.txt
          echo "OK Supabase RPC is reachable with the deployed publishable key and returns CORS headers"
