<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f2"><meta name="description" content="A simple, gentle 12-week gym tracker. Two days a week, at your pace.">
  <title>Steady · Your gym week</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./plan.js"></script><script defer src="./app.js"></script>
</head>
<body>
  <div id="app"></div>
  <dialog id="settings" aria-labelledby="settings-title"></dialog>
  <dialog id="guide" aria-labelledby="guide-title"></dialog>
  <dialog id="confirm" aria-labelledby="confirm-title"></dialog>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>This tracker needs JavaScript enabled to save and display your workouts.</noscript>
</body>
</html>
